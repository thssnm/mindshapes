<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1222">
<meta name="referrer" content="no-referrer">
<title>MIND//SHAPES</title>
<style>
:root{
  --bg:#0c1222;--bg2:#121a2f;--bg3:#18233f;--line:#232f4d;--line2:#3a4a75;
  --txt:#e9eefb;--mut:#93a0bf;--acc:#3ddcff;--acc-soft:rgba(61,220,255,.14);
  --vio:#a593ff;--mag:#f26bd8;--amb:#ffc857;--bad:#ff7a8c;--ok:#6cf0b4;--ink:#07101f;
  --font:"Avenir Next","Avenir","Century Gothic","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(58rem 38rem at 8% -12%,var(--acc-soft),transparent 62%),radial-gradient(46rem 34rem at 108% 112%,rgba(165,147,255,.11),transparent 62%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.32;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 72px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/72px 100%;
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%)}
#app{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block}

/* ---------- Bausteine ---------- */
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:rgba(18,26,47,.6);font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,background .15s,transform .08s;text-decoration:none;color:var(--txt)}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--ink);box-shadow:0 0 26px var(--acc-soft)}
.btn.danger{border-color:rgba(255,122,140,.55);color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.ico{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(18,26,47,.6);display:grid;place-items:center}
.ico:hover{border-color:var(--acc)}
.ico svg{width:20px;height:20px}
.ico.off{color:var(--mut)}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(20px,4vw,52px) clamp(16px,4vw,40px) 40px}
.narrow{max-width:720px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--txt);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Menü ---------- */
.top{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start;margin-bottom:clamp(26px,5vw,56px)}
.brand{font-size:clamp(29px,7.4vw,70px);font-weight:600;letter-spacing:.12em;line-height:1.05;white-space:nowrap}
.brand span{color:var(--acc);font-weight:300;letter-spacing:-.04em;margin:0 .08em 0 .02em}
.claim{grid-column:1;color:var(--mut);font-size:clamp(15px,2vw,19px);letter-spacing:.05em}
.topact{grid-column:2;grid-row:1/3;display:flex;gap:8px}
.modes{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.mode{position:relative;text-align:left;border-radius:22px;padding:clamp(20px,3vw,32px);min-height:clamp(300px,37vw,400px);display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:border-color .2s,transform .2s}
.mode .mname{margin-top:18px}
.mode:hover{transform:translateY(-2px)}
.mode.endless{background:linear-gradient(155deg,#1a2749 0%,var(--bg2) 58%);border:1px solid var(--line)}
.mode.endless:hover{border-color:var(--acc)}
.mode.daily{background:radial-gradient(22rem 16rem at 76% 14%,rgba(165,147,255,.2),transparent 70%),var(--bg);border:1px solid var(--line2)}
.mode.daily:hover{border-color:var(--vio)}
.mname{font-size:clamp(27px,4vw,40px);font-weight:600;letter-spacing:.22em;line-height:1.1}
.mtag{color:var(--mut);font-size:17px}
.mmeta{margin-top:10px;font-size:15px;color:var(--txt)}
.mmeta i{font-style:normal;color:var(--mut);margin-left:.6em}
.cta{align-self:flex-start;margin-top:16px;padding:12px 18px;border-radius:10px;font-weight:700;background:var(--acc);color:var(--ink)}
.daily .cta{background:transparent;border:1px solid var(--vio);color:var(--txt)}
.daily.done .cta{border-color:var(--ok);color:var(--ok)}
.next{font-size:14px;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}
.art{height:clamp(104px,13vw,148px);margin-bottom:auto;display:flex;align-items:center;flex:none}
.stream{height:100%;width:calc(100% + 80px);max-width:none;margin-right:-80px;flex:none}
.sigil{display:block;aspect-ratio:1}
.art .sigil{height:100%}
.sigil svg{width:100%;height:100%;overflow:visible}
.sg{fill:none;stroke-width:1.5;stroke-linecap:round}
.sigil.draw .sg{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,.1,.2,1) forwards}
.sigil.draw .sd{opacity:0;animation:fade .6s 1.3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.facts{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:18px 28px;align-items:end;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.fact span{display:block;font-size:14px;color:var(--mut)}
.fact b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.fact b small{font-size:14px;font-weight:400;color:var(--mut);margin-left:.4em}
.foot{margin-top:30px;font-size:14px;color:var(--mut)}
@media(max-width:780px){
  .modes{grid-template-columns:1fr}
  .mode{min-height:0}
  .facts{grid-template-columns:1fr 1fr}
  .facts .wide{grid-column:1/-1}
  .facts .btn{grid-column:1/-1}
}

/* ---------- Spiel ---------- */
.game{max-width:720px;margin:0 auto;padding:14px 16px 24px}
.ghead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.gmode{line-height:1.25}
.gmode b{display:block;font-weight:600;letter-spacing:.16em;font-size:15px}
.gmode span{font-size:14px;color:var(--mut)}
.timer{font-variant-numeric:tabular-nums;font-size:21px;letter-spacing:.06em}
.prog{height:3px;background:var(--line);border-radius:2px;margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .6s}
.progl{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:12px}
.ptype{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:14px;color:var(--mut)}
.ptype b{color:var(--acc);font-weight:600;letter-spacing:.04em}
.tier{padding:2px 10px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--txt)}
.tier.d2{border-color:var(--vio);color:var(--vio)}
.tier.d3{border-color:var(--mag);color:var(--mag)}
.intro{margin-top:10px;padding:10px 14px;border-left:2px solid var(--acc);background:var(--acc-soft);border-radius:0 10px 10px 0;font-size:15px}
.prompt{font-size:clamp(18px,2.6vw,22px);font-weight:500;line-height:1.35;margin-top:8px;max-width:38em}
.rules{margin-top:8px;font-size:14px;color:var(--mut);max-width:44em}
.rules li{padding-left:14px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:1px;background:var(--line2)}
.stage{border:1px solid var(--line);border-radius:18px;background:rgba(18,26,47,.74);padding:clamp(14px,3vw,26px);margin:14px 0 10px;animation:rise .35s ease both}
.stage.shake{animation:shake .32s}
.stage.locked{pointer-events:none}
.stage.win{border-color:var(--ok);box-shadow:0 0 34px rgba(108,240,180,.12)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.hints{display:grid;gap:6px;margin:0 0 6px}
.hints li{font-size:15px;padding:8px 12px 8px 40px;border:1px solid var(--line);border-radius:10px;position:relative;background:rgba(165,147,255,.07)}
.hints li::before{content:attr(data-n);position:absolute;left:12px;top:8px;color:var(--vio);font-weight:700}
.msg{min-height:24px;font-size:15px;color:var(--amb)}
.msg.bad{color:var(--bad)}
.bar{position:sticky;bottom:0;z-index:3;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(12,18,34,0),var(--bg) 34%)}
.bar .primary{margin-left:auto;min-width:118px}
@media(max-width:540px){.bar .btn.sq{padding:0;width:48px}.bar .btn.sq span{display:none}.bar .btn{padding:0 14px}}
.result{border:1px solid var(--ok);border-radius:18px;padding:20px;background:rgba(108,240,180,.06);display:grid;gap:10px;animation:rise .3s ease both;margin-bottom:24px}
.result h3{font-size:22px;font-weight:600}
.pts{font-size:30px;font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums;line-height:1.1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2)}
.tags li.good{border-color:var(--ok);color:var(--ok)}
.explain{color:var(--txt);font-size:15px;max-width:44em}
.note{font-size:15px;color:var(--amb)}
.result .btn{justify-self:start;margin-top:4px}

/* ---------- Puzzle-Elemente ---------- */
.fig{display:grid;justify-items:center;gap:12px}
.fig.src{margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed var(--line2)}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.num{min-width:52px;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;text-align:center;font-size:21px;font-variant-numeric:tabular-nums;background:var(--bg2)}
.qslot{border:1.5px dashed var(--acc)!important;color:var(--acc)}
.qslot.filled{border-style:solid!important;background:var(--acc-soft)}
.pairs{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(96px,auto) 30px minmax(68px,auto);align-items:center;font-size:21px;font-variant-numeric:tabular-nums}
.prow span{text-align:right}
.prow i{font-style:normal;text-align:center;color:var(--mut)}
.prow b{font-weight:500;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;text-align:center;background:var(--bg2)}
.prow.last{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.cond{display:grid;gap:6px;width:100%;max-width:30em}
.cond li{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:16px}
.bigq{min-width:120px;padding:10px 18px;border-radius:12px;font-size:28px;text-align:center;font-variant-numeric:tabular-nums}
.numdisp{width:150px;margin:14px auto 0;padding:8px;border-radius:12px;font-size:26px;text-align:center;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:288px;margin:18px auto 0}
.key{height:52px;font-size:20px;border-radius:10px;border:1px solid var(--line2);background:var(--bg3)}
.key:active{background:var(--acc-soft);border-color:var(--acc)}
.cubes{height:auto;max-height:44vh}
.cubes .ft{fill:#2b3d6b}.cubes .fl{fill:#1c2a4d}.cubes .fr{fill:#131d38}
.cubes polygon{stroke:var(--acc);stroke-width:1.2;stroke-linejoin:round}
.cubes .ground{fill:none;stroke:var(--line2);stroke-dasharray:4 4}
.ref{display:grid;justify-items:center;gap:4px;margin:0 auto 16px;padding-bottom:16px;border-bottom:1px dashed var(--line2)}
.ref svg{width:min(46%,170px)}
.ref.wide svg{width:min(60%,230px)}
.cap{font-size:13px;color:var(--mut)}
.opts{display:grid;gap:10px;max-width:480px;margin:0 auto}
.opts.c2{grid-template-columns:repeat(2,1fr)}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:420px){.opts.c4{grid-template-columns:repeat(2,1fr)}}
.opt{position:relative;padding:18px 10px 10px;border:1px solid var(--line2);border-radius:14px;background:var(--bg2);transition:border-color .15s,box-shadow .15s}
.opt svg{width:100%;height:auto}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 24px var(--acc-soft)}
.opt.x{opacity:.32;border-style:dashed}
.ol{position:absolute;left:10px;top:4px;font-size:13px;color:var(--mut);font-weight:600}
.pc{fill:rgba(61,220,255,.13);stroke:#3ddcff;stroke-width:1.5}
.pc.m1{fill:#f26bd8;stroke:#f26bd8}.pc.m2{fill:#ffc857;stroke:#ffc857}
.shape{fill:rgba(61,220,255,.16);stroke:#3ddcff;stroke-width:1.6;stroke-linejoin:round}
.gridl{stroke:#2a3760;stroke-width:.6}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:0 auto 16px}
.matrix>div{border:1px solid var(--line);border-radius:10px;background:var(--bg2);aspect-ratio:1}
.matrix>div.hole{border:1.5px dashed var(--acc);display:grid;place-items:center;color:var(--acc);font-size:26px;background:var(--acc-soft)}
.netsvg{width:min(100%,330px);margin:0 auto}
.face rect{fill:var(--bg2);stroke:var(--line2);stroke-width:1.5;transition:fill .15s}
.face text{fill:var(--mut);font-size:17px;font-weight:600;text-anchor:middle;pointer-events:none}
.face{cursor:pointer}
.face.mark rect{fill:var(--acc);stroke:var(--acc)}
.face.mark text{fill:var(--ink)}
.face.sel rect{fill:rgba(165,147,255,.3);stroke:var(--vio);stroke-width:3}
.face.sel text{fill:var(--txt)}
.face.x{opacity:.35}
.symsvg{width:min(100%,360px);margin:0 auto;touch-action:manipulation}
.symsvg .c{fill:var(--bg2);stroke:var(--line);stroke-width:1;cursor:pointer}
.symsvg .c.g{fill:var(--acc);stroke:var(--acc);cursor:default}
.symsvg .c.on{fill:var(--vio);stroke:var(--vio)}
.axis{stroke:var(--amb);stroke-width:2;stroke-dasharray:7 6;fill:none;pointer-events:none}
.pgrid{display:grid;gap:4px;max-width:340px;margin:0 auto}
.pcell{aspect-ratio:1;border-radius:6px;border:0;position:relative;padding:0}
.pcell::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(7,16,31,.55)}

.k1::after{width:26%;height:26%;border-radius:50%}
.k2::after{width:44%;height:12%}
.k3::after{width:26%;height:26%;transform:translate(-50%,-50%) rotate(45deg)}
.pcell.hole{background:transparent;border:1.5px dashed var(--acc);color:var(--acc);font-size:18px}
.k0,.pcell.k0{background:#3ddcff}.k1,.pcell.k1{background:#a593ff}.k2,.pcell.k2{background:#f26bd8}.k3,.pcell.k3{background:#ffc857}
.pcell.hole.set{border:0;box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--txt)}
.legend{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;position:relative}
.board{width:100%;margin:0 auto;-webkit-user-select:none;user-select:none;touch-action:none}
.tcell{fill:rgba(61,220,255,.07);stroke:var(--acc);stroke-width:1.2;stroke-dasharray:5 4}
.piece{cursor:grab;outline:none}
.piece rect{stroke:rgba(7,16,31,.55);stroke-width:1.5;fill-opacity:.9}
.piece.drag{cursor:grabbing}
.piece.drag rect,.piece:focus-visible rect{stroke:#fff;stroke-width:2}
.ghost rect{fill:none;stroke-width:2.5;stroke-dasharray:6 5}
.expr{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:26px;font-variant-numeric:tabular-nums}
.slot{width:54px;height:58px;border-radius:12px;border:1.5px dashed var(--line2);background:var(--bg2);font-size:24px;font-weight:600}
.slot.so{width:44px;height:44px;border-radius:50%;color:var(--vio)}
.slot.full{border-style:solid;border-color:var(--acc)}
.slot.so.full{border-color:var(--vio)}
.par{color:var(--mut);font-size:34px;font-weight:300;line-height:1}
.eqs{color:var(--mut);margin:0 4px}
.target{min-width:62px;padding:8px 14px;border-radius:12px;background:var(--acc);color:var(--ink);font-weight:700;text-align:center}
.rhs{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
@media(max-width:480px){.expr{gap:3px;font-size:22px}.slot{width:38px;height:46px;font-size:20px;border-radius:10px}.slot.so{width:34px;height:40px;border-radius:17px;font-size:19px}.par{font-size:28px}.target{min-width:54px;padding:6px 12px}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.tile{width:54px;height:54px;border-radius:12px;border:1px solid var(--line2);background:var(--bg3);font-size:22px;font-weight:600}
.tile.to{width:48px;height:48px;border-radius:50%;color:var(--vio);border-color:rgba(165,147,255,.55)}
.tile:disabled{opacity:.22}
.lrow{display:flex;justify-content:center;gap:8px}
.lcard{flex:1 1 0;max-width:108px;min-width:0;display:grid;gap:6px;justify-items:stretch;text-align:center}
.lpos{font-size:13px;color:var(--mut)}
.lbtn{border:1px solid var(--line2);border-radius:14px;background:var(--bg2);padding:6px;aspect-ratio:1}
.lbtn svg{width:100%;height:100%}
.lcol{border:1px solid var(--line2);border-radius:10px;background:var(--bg2);min-height:40px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;overflow:hidden}
.lcol i{width:14px;height:14px;border-radius:50%;border:1px dashed var(--mut);flex:none}
.lcol.set i{border:0}
.clues{margin-top:18px;display:grid;gap:6px;counter-reset:c}
.clues button{width:100%;text-align:left;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);position:relative;font-size:16px;line-height:1.35}
.clues button::before{counter-increment:c;content:counter(c);position:absolute;left:13px;top:9px;color:var(--mut);font-variant-numeric:tabular-nums}
.clues button.done{opacity:.45;text-decoration:line-through}
.cluehint{font-size:13px;color:var(--mut);margin-top:8px;text-align:center}

/* ---------- Daily-Ergebnis, Fortschritt, Einstellungen ---------- */
.sub{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:26px}
.sub h2{font-size:26px;font-weight:600;letter-spacing:.04em}
.card{border:1px solid var(--line2);border-radius:22px;padding:clamp(20px,4vw,34px);background:radial-gradient(24rem 18rem at 82% 0%,rgba(165,147,255,.16),transparent 70%),var(--bg2);display:grid;grid-template-columns:1fr auto;gap:18px 24px;align-items:start}
.card .sigil{width:clamp(104px,24vw,168px)}
.card h3{font-size:15px;font-weight:500;color:var(--mut)}
.card .big{font-size:clamp(26px,5vw,38px);font-weight:600;line-height:1.15;margin-top:4px}
.card .when{color:var(--mut);margin-top:2px}
.kv{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px;padding-top:18px;border-top:1px solid var(--line)}
.kv dt{font-size:13px;color:var(--mut)}
.kv dd{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.share{margin-top:18px;display:grid;gap:12px}
.share pre{margin:0;padding:14px 16px;border:1px dashed var(--line2);border-radius:12px;font:15px/1.5 var(--font);white-space:pre-wrap;color:var(--txt);-webkit-user-select:all;user-select:all}
.rowb{display:flex;flex-wrap:wrap;gap:8px}
details.sol{margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.sol summary{cursor:pointer;color:var(--mut)}
details.sol p{margin-top:8px}
.sec{margin-top:30px}
.sec>h3{font-size:17px;font-weight:600;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tilebox{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(18,26,47,.7)}
.tilebox span{display:block;font-size:13px;color:var(--mut)}
.tilebox b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:132px 1fr 44px;gap:12px;align-items:center;font-size:15px}
.barrow i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.barrow i u{display:block;height:100%;background:var(--acc);border-radius:4px}
.barrow b{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.sigils{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
.sigils figure{margin:0;text-align:center;font-size:11px;color:var(--mut)}
.sigils .sigil{width:100%}
.empty{color:var(--mut);font-size:15px}
.setrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow p{font-size:14px;color:var(--mut)}
.sw{width:58px;height:34px;border-radius:17px;border:1px solid var(--line2);background:var(--bg2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:var(--acc-soft);border-color:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(24px);background:var(--acc)}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.theme{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.theme i{width:22px;height:22px;border-radius:50%;grid-row:1/3}
.theme b{font-weight:600;font-size:15px}
.theme span{font-size:12px;color:var(--mut)}
.theme[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.theme:disabled{opacity:.5}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:12px;resize:vertical}
.hintline{font-size:14px;color:var(--mut);margin-top:10px}
.warn{font-size:14px;color:var(--amb);margin-top:10px}

function genOp(R,d){

function genRiddle(R,d){
  for(let t=0;t<60;t++){

      add(`Genau ${new Set(dg).size===3?'drei':new Set(dg).size===2?'zwei':'eine'} verschiedene Ziffer${new Set(dg).size===1?'':'n'} kommen in ihr vor.`.replace('eine verschiedene Ziffer kommen','eine einzige Ziffer kommt'),x=>new Set(D(x)).size===new Set(dg).size);
    }

/* ---------------------------------------------------------------- C · EQUATION BUILDER */
const TPL={a:'N O N O N',b:'( N O N ) O N',c:'N O ( N O N )',d:'N O N O N O N',e:'( N O N ) O N O N',f:'N O ( N O N ) O N',g:'( N O N ) O ( N O N )',h:'N O N O ( N O N )',i:'( N O N O N ) O N'};

function evalTokens(tk){

  const term=()=>{let v=fac();while(tk[i]==='×'||tk[i]==='÷'){const o=tk[i++],w=fac();v=o==='×'?v*w:v/w;}return v;};

}
function fillTpl(tpl,vals){let k=0;return tpl.map(t=>t==='N'||t==='O'?vals[k++]:t);}

    const isN=slots[k]==='N',pool=isN?nums:ops,used=isN?un:uo,tried=new Set();

}
const exprStr=(tpl,vals)=>fillTpl(tpl,vals).join(' ').replace(/\( /g,'(').replace(/ \)/g,')');
function genEquation(R,d,forced){

             {tp:['a','a','b','c'],hi:9,dn:1,ops:['+','−','×'],dop:1,lo:5,max:90,lim:8},
             {tp:['d','b','c','e','f','h'],hi:10,dn:1,ops:['+','−','×','÷'],dop:2,lo:8,max:160,lim:5},
             {tp:['e','f','g','h','i','d'],hi:12,dn:2,ops:['+','−','×','÷'],dop:2,lo:10,max:240,lim:3}][d];
  for(let t=0;t<260;t++){
    const tpl=TPL[R.pick(cfg.tp)],nN=tpl.filter(x=>x==='N').length,nO=tpl.filter(x=>x==='O').length;
    const lim=t>160?cfg.lim*3:cfg.lim;
    const nums=R.shuffle(range(cfg.hi).map(i=>i+1)).slice(0,nN+cfg.dn);
    if(d>=2&&R.chance(.4))nums[R.int(0,nums.length-1)]=R.pick([12,15,20,25]);
    const ops=series(nO+cfg.dop,()=>R.pick(cfg.ops));
    if(new Set(ops).size<(d>=2?3:2))continue;
    let target=forced,sol;
    if(forced==null){
      const vals=[];let a=0,b=0;tpl.forEach(x=>{if(x==='N')vals.push(nums[a++]);if(x==='O')vals.push(ops[b++]);});
      target=evalTokens(fillTpl(tpl,vals));

    }

      prompt:'Setze Zahlen und Rechenzeichen so in die Felder, dass das Ziel herauskommt.',
      rules:['Jede Kachel darf höchstens einmal verwendet werden.',cfg.dn?'Nicht alle Kacheln werden gebraucht.':'Ein Rechenzeichen bleibt übrig.','Punkt vor Strich; Klammern werden zuerst gerechnet.'],
      view:{tpl,nums:sn,ops:so,target},solution:sol,
      hints:['Überlege zuerst die Größenordnung: Kommst du eher durch Malnehmen oder durch Addieren in die Nähe des Ziels?',
        `In einer Lösung ${uniq.length>1?'kommen diese Rechenzeichen vor':'kommt nur dieses Rechenzeichen vor'}: ${uniq.join(' und ')}.`,
        `Eine Lösung beginnt so: ${fillTpl(tpl,sol).slice(0,tpl[0]==='('?3:2).join(' ')} …`],

function genFusion(R,d){

function genEq(R,d){return d>=2&&R.chance(.3)?(genFusion(R,d)||genEquation(R,d)):genEquation(R,d);}

/* ---------------------------------------------------------------- Polyomino-Werkzeuge */
const P_ROT=c=>c.map(([x,y,m])=>[-y,x,m||0]),P_MIR=c=>c.map(([x,y,m])=>[-x,y,m||0]);

const pDims=c=>{const n=pNorm(c);return[Math.max(...n.map(p=>p[0]))+1,Math.max(...n.map(p=>p[1]))+1];};
function randPoly(R,n){
  const cells=[[0,0,0]],has=new Set(['0,0']);
  while(cells.length<n){const [x,y]=R.pick(cells),[dx,dy]=R.pick(DIRS),k=(x+dx)+','+(y+dy);if(!has.has(k)){has.add(k);cells.push([x+dx,y+dy,0]);}}
  return pNorm(cells);
}
function pConnected(c){

  while(q.length){const [x,y]=q.pop();for(const [dx,dy] of DIRS){const k=(x+dx)+','+(y+dy);if(set.has(k)&&!seen.has(k)){seen.add(k);q.push([x+dx,y+dy]);}}}
  return seen.size===c.length;
}
function has2x2(c){const s=new Set(c.map(p=>p[0]+','+p[1]));return c.some(([x,y])=>s.has((x+1)+','+y)&&s.has(x+','+(y+1))&&s.has((x+1)+','+(y+1)));}
/* Würfelnetz falten: ein Würfel rollt über das Netz; die jeweils unten liegende Seite markiert das Feld. */
function foldNet(cells){
  if(cells.length!==6||has2x2(cells))return null;

  const q=[[0,[0,1,2,3,4,5]]];lab[0]=1;               // Orientierung [U,D,N,S,E,W]
  while(q.length){
    const [i,o]=q.shift(),[x,y]=cells[i],[U,Dn,N,S,E,W]=o;
    const mv=[[1,0,[W,E,N,S,U,Dn]],[-1,0,[E,W,N,S,Dn,U]],[0,1,[N,S,Dn,U,E,W]],[0,-1,[S,N,U,Dn,E,W]]];
    for(const [dx,dy,no] of mv){const j=idx.get((x+dx)+','+(y+dy));if(j!==undefined&&lab[j]<0){lab[j]=no[1];q.push([j,no]);}}

function randNet(R,pred){for(let t=0;t<4000;t++){const c=randPoly(R,6);const l=foldNet(c);if(l&&(!pred||pred(c)))return c;}return null;}

function genNetOpp(R,d){

  return{sub:'netopp',kind:'net',rating:d?4:2,prompt:`Dieses Netz wird zu einem Würfel gefaltet. Welche Fläche liegt dann der Fläche ${LETTERS[m]} genau gegenüber?`,
    rules:['Tippe die Fläche im Netz an.'],view:{cells:c,mark:m},solution:opp,
    hints:['Lass eine Fläche als Boden liegen und klappe die anderen gedanklich hoch.','Gegenüberliegende Flächen berühren sich nie. In einer geraden Reihe liegt immer genau eine Fläche dazwischen.',`Die Flächen ${LETTERS[two[0]]} und ${LETTERS[two[1]]} grenzen am Würfel an ${LETTERS[m]} – sie scheiden aus.`],

}
function genNetValid(R,d){

  const invalid=()=>{for(let t=0;t<800;t++){const c=randPoly(R,6);if(foldNet(c))continue;if(near&&(has2x2(c)||Math.max(...pDims(c))>4))continue;return c;}return null;};

    rules:['Beim Falten darf keine Fläche auf einer anderen landen.'],view:{fig:'polys',opts:view,cols:2},solution:ans,
    hints:['Wähle in jedem Netz eine Bodenfläche und klappe die übrigen gedanklich hoch.','Ein Netz scheitert, wenn zwei Flächen auf derselben Würfelseite landen. Vier Quadrate an einem gemeinsamen Punkt oder fünf in einer Reihe gehen nie.',
      wantValid?`Netz ${LETTERS[other]} scheidet aus: Dort würden sich zwei Flächen überdecken.`:`Netz ${LETTERS[other]} lässt sich falten – es ist nicht das gesuchte.`],
    explain:wantValid?`Nur Netz ${LETTERS[ans]} schließt sich zu einem Würfel. Bei den anderen landen zwei Flächen auf derselben Seite.`:`Bei Netz ${LETTERS[ans]} landen zwei Flächen auf derselben Würfelseite. Die anderen drei schließen sich sauber.`,

function genRotate(R,d){

    R.shuffle(range(n)).slice(0,marks).forEach((i,k)=>c[i][2]=k+1);

      explain:`Figur ${LETTERS[ans]} ist die Vorlage, um ${turn*90}° im Uhrzeigersinn gedreht. Die anderen sind gespiegelt oder leicht verändert.`,sig:'rot:'+ref};

function cubeStats(h){
  const W=h.length,D=h[0].length;let sum=0,hid=0,mx=0;
  for(let i=0;i<W;i++)for(let j=0;j<D;j++){sum+=h[i][j];mx=Math.max(mx,h[i][j]);
    for(let z=0;z<h[i][j]-1;z++)if((i+1<W?h[i+1][j]:0)>z&&(j+1<D?h[i][j+1]:0)>z)hid++;}

function genCubes(R,d,force){

      rules:['Platz 1 ist ganz links.',cats===2?'Jede Form und jede Farbe kommt genau einmal vor.':'Jede Form kommt genau einmal vor.'],
      view:{N,cats,shapes,colors,clues:R.shuffle(chosen).map(c=>c.t.replace(/ von dem /g,' vom '))},solution:{s:solS,c:cats===2?solC:null},

      explain:'Lösung von links nach rechts: '+range(N).map(p=>L_SHAPE[shapes[solS[p]]].n+(cats===2?' ('+L_COLOR[colors[solC[p]]].n+')':'')).join(', ')+'.',

function areaSVG(p){

  for(let x=0;x<=W;x++)g+=`<line class="gridl" x1="${pad+x*u}" y1="${pad}" x2="${pad+x*u}" y2="${pad+H*u}"/>`;
  for(let y=0;y<=H;y++)g+=`<line class="gridl" x1="${pad}" y1="${pad+y*u}" x2="${pad+W*u}" y2="${pad+y*u}"/>`;
  return`<svg viewBox="0 0 ${W*u+2*pad} ${H*u+2*pad}" aria-hidden="true">${g}<polygon class="shape" points="${p.map(([x,y])=>(ox+x*u)+','+(oy+y*u)).join(' ')}"/></svg>`;
}
function cellSVG(o){
  const pos=[[[30,30,15]],[[18.5,30,10.5],[41.5,30,10.5]],[[30,18,9.5],[17.5,41,9.5],[42.5,41,9.5]]][o.n];
  return`<svg viewBox="0 0 60 60" aria-hidden="true">${pos.map(([x,y,r])=>glyph(SHAPES[o.s],x,y,r,COL[o.c],o.f)).join('')}</svg>`;
}
function cubesSVG(h){
  const W=h.length,D=h[0].length,mx=Math.max(...h.flat()),cw=26,ch=15,zh=30,pad=6,ox=pad+D*cw,oy=pad+mx*zh,vw=(W+D)*cw+2*pad;
  const P=(i,j,z)=>(ox+(i-j)*cw)+','+(oy+(i+j)*ch-z*zh);
  let s=`<polygon class="ground" points="${P(0,0,0)} ${P(W,0,0)} ${P(W,D,0)} ${P(0,D,0)}"/>`;
  for(let sum=0;sum<=W+D-2;sum++)for(let i=0;i<W;i++){const j=sum-i;if(j<0||j>=D)continue;
    for(let z=0;z<h[i][j];z++)s+=`<polygon class="fl" points="${P(i,j+1,z+1)} ${P(i+1,j+1,z+1)} ${P(i+1,j+1,z)} ${P(i,j+1,z)}"/><polygon class="fr" points="${P(i+1,j,z+1)} ${P(i+1,j+1,z+1)} ${P(i+1,j+1,z)} ${P(i+1,j,z)}"/><polygon class="ft" points="${P(i,j,z+1)} ${P(i+1,j,z+1)} ${P(i+1,j+1,z+1)} ${P(i,j+1,z+1)}"/>`;}
  return`<svg class="cubes" style="width:min(100%,${Math.round(vw*1.55)}px)" viewBox="0 0 ${vw} ${(W+D)*ch+mx*zh+2*pad}" role="img" aria-label="Bauwerk aus Würfeln">${s}</svg>`;
}
function figHTML(v){
  if(v.fig==='seq')return`<div class="seq">${v.terms.map(t=>t==null?'<span class="num qslot">?</span>':`<span class="num">${String(t).replace('-','−')}</span>`).join('')}</div>`;
  if(v.fig==='pairs')return`<div class="pairs">${v.rows.map(r=>`<div class="prow"><span>${r[0]}</span><i>${v.sym}</i><b>${r[1].replace('-','−')}</b></div>`).join('')}<div class="prow last"><span>${v.q}</span><i>${v.sym}</i><b class="qslot">?</b></div></div>`;
  if(v.fig==='riddle')return`<ul class="cond">${v.lines.map(l=>`<li>${l}</li>`).join('')}</ul><div class="bigq qslot">?</div>`;
  if(v.fig==='cubes')return cubesSVG(v.h);
  return'';
}
function keepFocus(host,draw){
  const a=document.activeElement,inside=a&&host.contains(a)&&a.dataset,sel=inside?Object.keys(a.dataset).map(k=>`[data-${k}="${a.dataset[k]}"]`).join(''):'';
  draw();if(sel){const n=host.querySelector(sel);if(n)n.focus({preventScroll:true});}
}

const MOUNT={
  number(p,host,ctl){

  },
  choice(p,host,ctl){

    return{get(){return sel<0?{inc:'Wähle zuerst eine Antwort aus.'}:sel;},reset(){sel=-1;paint();},wrong(a){dead.add(a);sel=-1;paint();},
      key(e){const i=LETTERS.indexOf(e.key.toUpperCase());if(e.key.length===1&&i>=0&&i<v.opts.length){pick(i);return true;}return false;}};
  },
  net(p,host,ctl){
    const v=p.view,U=46,w=Math.max(...v.cells.map(c=>c[0]))+1,h=Math.max(...v.cells.map(c=>c[1]))+1,dead=new Set();let sel=-1;

    const paint=()=>host.querySelectorAll('.face').forEach((g,i)=>{g.classList.toggle('sel',i===sel);g.classList.toggle('x',dead.has(i));});

    return{get(){return sel<0?{inc:'Tippe zuerst eine Fläche im Netz an.'}:sel;},reset(){sel=-1;paint();},wrong(a){dead.add(a);sel=-1;paint();},
      key(e){const i=LETTERS.indexOf(e.key.toUpperCase());if(e.key.length===1&&i>=0&&i<6){pick(i);return true;}return false;}};
  },
  sym(p,host,ctl){
    const v=p.view,n=v.n,U=40,S2=n*U,given=new Set(v.given),on=new Set(),t=v.type,ax=[];

    if(t==='H'||t==='VH')ax.push(L(-6,S2/2,S2+6,S2/2));
    if(t==='D1'||t==='DD')ax.push(L(-4,-4,S2+4,S2+4));
    if(t==='D2'||t==='DD')ax.push(L(S2+4,-4,-4,S2+4));
    if(t==='R2'||t==='R4')ax.push(`<circle cx="${S2/2}" cy="${S2/2}" r="5" fill="var(--amb)"/><path class="axis" d="M${S2/2+15} ${S2/2}a15 15 0 1 1-4.4-10.6" style="stroke-dasharray:none"/><path d="M${S2/2+13} ${S2/2-17}v7h-7" fill="none" stroke="var(--amb)" stroke-width="2"/>`);
    host.innerHTML=`<svg class="symsvg" viewBox="-8 -8 ${S2+16} ${S2+16}" role="group" aria-label="Raster">${range(n*n).map(i=>`<rect class="c${given.has(i)?' g':''}" data-i="${i}" x="${(i%n)*U+1.5}" y="${Math.floor(i/n)*U+1.5}" width="${U-3}" height="${U-3}" rx="4" ${given.has(i)?'':`tabindex="0" role="button" aria-label="Zeile ${Math.floor(i/n)+1}, Spalte ${i%n+1}"`}/>`).join('')}${ax.join('')}</svg>`;
    const svg=$('svg',host),tog=el=>{const i=+el.dataset.i;if(given.has(i))return;if(on.has(i))on.delete(i);else on.add(i);el.classList.toggle('on',on.has(i));el.setAttribute('aria-pressed',on.has(i));ctl.changed(on.has(i)?'select':'click');};
    svg.addEventListener('click',e=>{const c=e.target.closest('.c');if(c)tog(c);});
    svg.addEventListener('keydown',e=>{const c=e.target.closest('.c');if(c&&(e.key===' '||e.key==='Enter')){e.preventDefault();e.stopPropagation();tog(c);}});
    return{get(){return on.size?[...on]:{inc:'Fülle zuerst mindestens ein Feld.'};},reset(){on.clear();host.querySelectorAll('.c.on').forEach(c=>c.classList.remove('on'));}};
  },
  paint(p,host,ctl){
    const v=p.view,n=v.n,val=v.miss.map(()=>-1),names=['Cyan','Violett','Magenta','Gelb'];
    const draw=()=>{host.innerHTML=`<div class="pgrid" style="grid-template-columns:repeat(${n},1fr)">${v.grid.map((g,i)=>{const m=v.miss.indexOf(i);
        if(m<0)return`<div class="pcell k${g}"></div>`;const c=val[m];
        return`<button type="button" class="pcell hole${c<0?'':' set k'+c}" data-m="${m}" aria-label="Zeile ${Math.floor(i/n)+1}, Spalte ${i%n+1}: ${c<0?'leer':names[c]}">${c<0?'?':''}</button>`;}).join('')}</div>
      <div class="legend">${range(v.k).map(c=>`<span><i class="k${c}"></i>${names[c]}</span>`).join('')}</div>`;};
    host.onclick=e=>{const b=e.target.closest('.hole');if(!b)return;const m=+b.dataset.m;val[m]=(val[m]+1)%v.k;keepFocus(host,draw);ctl.changed('select');};
    draw();
    return{get(){return val.includes(-1)?{inc:'Färbe zuerst alle leeren Felder.'}:val.slice();},reset(){val.fill(-1);draw();}};
  },
  assemble(p,host,ctl){
    const v=p.view,U=40,W=v.cols*U,H=v.rows*U,NS='http://www.w3.org/2000/svg';
    host.innerHTML=`<svg class="board" style="max-height:58vh" viewBox="0 0 ${W} ${H}" role="group" aria-label="Legefläche"><defs><pattern id="msdots" x="${-U/2}" y="${-U/2}" width="${U}" height="${U}" patternUnits="userSpaceOnUse"><circle cx="${U/2}" cy="${U/2}" r="1.3" fill="#3a4a75"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#msdots)"/>${v.target.map(([x,y])=>`<rect class="tcell" x="${x*U+1}" y="${y*U+1}" width="${U-2}" height="${U-2}" rx="3"/>`).join('')}<g class="ghost"></g><g class="layer"></g></svg>`;
    const svg=$('svg',host),layer=$('.layer',svg);let pcs=[],drag=null;
    const dims=c=>[Math.max(...c.map(q=>q[0]))+1,Math.max(...c.map(q=>q[1]))+1];
    const clamp=q=>{const d=dims(q.cells);q.x=Math.max(0,Math.min(v.cols-d[0],q.x));q.y=Math.max(0,Math.min(v.rows-d[1],q.y));};
    const place=q=>{q.g.innerHTML=q.cells.map(([x,y])=>`<rect x="${x*U+1.5}" y="${y*U+1.5}" width="${U-3}" height="${U-3}" rx="5"/>`).join('');q.g.setAttribute('transform',`translate(${q.x*U},${q.y*U})`);};
    const rotate=q=>{const d=dims(q.cells),cx=q.x+d[0]/2,cy=q.y+d[1]/2;q.cells=q.cells.map(([x,y])=>[d[1]-1-y,x]);q.x=Math.round(cx-d[1]/2);q.y=Math.round(cy-d[0]/2);clamp(q);place(q);};
    const pt=e=>{const m=svg.getScreenCTM();return{x:(e.clientX-m.e)/m.a,y:(e.clientY-m.f)/m.d};};
    function init(){
      layer.innerHTML='';
      pcs=v.pieces.map((src,i)=>{
        const g=document.createElementNS(NS,'g'),q={cells:src.cells.map(c=>c.slice()),x:src.x,y:src.y,g};
        g.setAttribute('class','piece');g.setAttribute('fill',COL[i%COL.length]);g.setAttribute('tabindex','0');g.setAttribute('role','button');
        g.setAttribute('aria-label',`Teil ${i+1} von ${v.pieces.length}. Pfeiltasten bewegen, Leertaste dreht.`);
        g.addEventListener('pointerdown',e=>{if(drag||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();const m=pt(e);
          drag={q,id:e.pointerId,dx:m.x-q.x*U,dy:m.y-q.y*U,sx:m.x,sy:m.y,moved:false,px:q.x*U,py:q.y*U};layer.appendChild(g);g.classList.add('drag');
          try{svg.setPointerCapture(e.pointerId);}catch(_){}});
        g.addEventListener('keydown',e=>{const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
          if(mv){e.preventDefault();q.x+=mv[0];q.y+=mv[1];clamp(q);place(q);ctl.changed('click');}
          else if(e.key===' '||e.key==='r'||e.key==='R'){e.preventDefault();e.stopPropagation();rotate(q);ctl.changed('select');}});
        layer.appendChild(g);place(q);return q;});
    }
    svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const m=pt(e);
      if(Math.hypot(m.x-drag.sx,m.y-drag.sy)>7)drag.moved=true;
      if(drag.moved){drag.px=m.x-drag.dx;drag.py=m.y-drag.dy;drag.q.g.setAttribute('transform',`translate(${drag.px},${drag.py})`);}});
    const end=(e,cancel)=>{if(!drag||drag.id!==e.pointerId)return;const d=drag,q=d.q;drag=null;q.g.classList.remove('drag');
      try{svg.releasePointerCapture(e.pointerId);}catch(_){}
      if(cancel){place(q);return;}
      if(d.moved){q.x=Math.round(d.px/U);q.y=Math.round(d.py/U);clamp(q);place(q);ctl.changed('click');}else{rotate(q);ctl.changed('select');}};
    svg.addEventListener('pointerup',e=>end(e,false));svg.addEventListener('pointercancel',e=>end(e,true));
    init();
    return{get(){return pcs.every((q,i)=>q.x===v.pieces[i].x&&q.y===v.pieces[i].y)?{inc:'Ziehe die Teile zuerst in die markierte Fläche.'}:pcs.map(q=>q.cells.map(([x,y])=>[x+q.x,y+q.y]));},reset(){drag=null;init();},
      hint(n){if(n>=3)$('.ghost',svg).innerHTML=v.pieces[0].sol.map(([x,y])=>`<rect x="${x*U+4}" y="${y*U+4}" width="${U-8}" height="${U-8}" rx="4" stroke="${COL[0]}"/>`).join('');}};
  },
  equation(p,host,ctl){
    const v=p.view,kinds=v.tpl.filter(t=>t==='N'||t==='O');let fill=kinds.map(()=>null);
    const draw=()=>{let k=0;
      const usedN=new Set(),usedO=new Set();fill.forEach((f,i)=>{if(f!=null)(kinds[i]==='N'?usedN:usedO).add(f);});
      const expr=v.tpl.map(t=>{if(t==='('||t===')')return`<span class="par">${t}</span>`;const i=k++,f=fill[i],txt=f==null?'':(t==='N'?v.nums[f]:v.ops[f]);
        return`<button type="button" class="slot ${t==='N'?'sn':'so'}${f==null?'':' full'}" data-s="${i}" aria-label="${t==='N'?'Zahlenfeld':'Zeichenfeld'}: ${f==null?'leer':txt+', antippen zum Leeren'}">${txt}</button>`;}).join('');
      host.innerHTML=`${v.src?`<div class="fig src">${figHTML(v.src)}</div>`:''}<div class="expr">${expr}<span class="rhs"><span class="eqs">=</span><span class="target" aria-label="Ziel">${v.src?'?':v.target}</span></span></div>
        <div class="tiles" role="group" aria-label="Zahlen">${v.nums.map((n,i)=>`<button type="button" class="tile tn" data-n="${i}" ${usedN.has(i)?'disabled':''}>${n}</button>`).join('')}</div>
        <div class="tiles" role="group" aria-label="Rechenzeichen">${v.ops.map((o,i)=>`<button type="button" class="tile to" data-o="${i}" ${usedO.has(i)?'disabled':''}>${o}</button>`).join('')}</div>`;};
    host.onclick=e=>{
      const s=e.target.closest('.slot'),t=e.target.closest('.tile');
      if(s){const i=+s.dataset.s;if(fill[i]!=null){fill[i]=null;keepFocus(host,draw);ctl.changed('click');}return;}
      if(!t||t.disabled)return;
      const isN=t.dataset.n!==undefined,idx=+(isN?t.dataset.n:t.dataset.o),slot=kinds.findIndex((kd,i)=>kd===(isN?'N':'O')&&fill[i]==null);
      if(slot<0){ctl.say('Alle Felder dieser Art sind belegt. Tippe ein Feld an, um es zu leeren.');return;}
      fill[slot]=idx;keepFocus(host,draw);ctl.changed('select');};
    draw();
    return{get(){return fill.some(f=>f==null)?{inc:'Fülle zuerst alle Felder der Gleichung.'}:fill.map((f,i)=>kinds[i]==='N'?v.nums[f]:v.ops[f]);},reset(){fill=kinds.map(()=>null);draw();}};
  },
  logic(p,host,ctl){
    const v=p.view,N=v.N,two=v.cats===2;let s=Array(N).fill(-1),c=Array(N).fill(-1);const done=new Set();
    const draw=()=>{
      const cards=range(N).map(i=>{
        const sh=s[i]<0?null:SHAPES[v.shapes[s[i]]],col=two?(c[i]<0?'#6a79a3':COL[v.colors[c[i]]]):COL[0];
        const g=sh?glyph(sh,30,30,18,col,two&&c[i]>=0?1:0):`<circle cx="30" cy="30" r="17" fill="${two&&c[i]>=0?col:'none'}" fill-opacity=".25" stroke="${col}" stroke-width="2" stroke-dasharray="4 5"/>`;
        return`<div class="lcard"><span class="lpos">Platz ${i+1}</span><button type="button" class="lbtn" data-f="${i}" aria-label="Form auf Platz ${i+1}: ${sh?L_SHAPE[v.shapes[s[i]]].n:'offen'}. Antippen zum Wechseln."><svg viewBox="0 0 60 60" aria-hidden="true">${g}</svg></button>${two?`<button type="button" class="lcol${c[i]<0?'':' set'}" data-c="${i}" aria-label="Farbe auf Platz ${i+1}: ${c[i]<0?'offen':L_COLOR[v.colors[c[i]]].n}. Antippen zum Wechseln."><i style="background:${c[i]<0?'transparent':col}"></i>${c[i]<0?'Farbe':L_COLOR[v.colors[c[i]]].n}</button>`:''}</div>`;}).join('');
      host.innerHTML=`<div class="lrow">${cards}</div><ol class="clues">${v.clues.map((t,i)=>`<li><button type="button" class="${done.has(i)?'done':''}" data-q="${i}" aria-pressed="${done.has(i)}">${t}</button></li>`).join('')}</ol><p class="cluehint">Tippe einen Hinweis an, um ihn als erledigt zu markieren.</p>`;};
    host.onclick=e=>{
      const f=e.target.closest('.lbtn'),k=e.target.closest('.lcol'),q=e.target.closest('.clues button');
      if(f){const i=+f.dataset.f;s[i]=s[i]+1>=N?-1:s[i]+1;}
      else if(k){const i=+k.dataset.c;c[i]=c[i]+1>=N?-1:c[i]+1;}
      else if(q){const i=+q.dataset.q;if(done.has(i))done.delete(i);else done.add(i);}
      else return;
      keepFocus(host,draw);ctl.changed(q?'click':'select');};
    draw();
    return{get(){
        if(s.includes(-1)||(two&&c.includes(-1)))return{inc:two?'Lege zuerst für jeden Platz eine Form und eine Farbe fest.':'Lege zuerst für jeden Platz eine Form fest.'};
        if(new Set(s).size<N)return{inc:'Jede Form darf nur einmal vorkommen.'};
        if(two&&new Set(c).size<N)return{inc:'Jede Farbe darf nur einmal vorkommen.'};
        return{s:s.slice(),c:two?c.slice():null};},
      reset(){s=Array(N).fill(-1);c=Array(N).fill(-1);done.clear();draw();}};
  }
};

const app=document.getElementById('app');

function countdown(){const e=$('#cd');if(!e)return;const ms=864e5-(Date.now()%864e5),s=Math.floor(ms/1000);e.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');}

const CTL={changed(k){say('');SND.play(k==='select'?'select':'click');},say(t){say(t);}};
function say(t,bad){const m=$('#msg');if(!m)return;m.textContent=t||'';m.classList.toggle('bad',!!bad);}
function elapsed(){return G.ms+(G.paused||G.solved?0:performance.now()-G.t0);}
function tick(){const t=$('#timer');if(t&&G)t.textContent=mmss(elapsed());}
function meta(){
  const l=$('#progl'),b=$('#bh span');if(!l)return;
  if(G.mode==='daily')l.innerHTML=`<span>Versuche: ${G.attempts}</span><span>Hinweise: ${G.hints} von 3</span>`;
  else{const t=tierOf(S.endless.power);l.innerHTML=`<span>Stufe ${DIFF[t]}</span><span>${t<3?'Nächste Stufe: '+DIFF[t+1]:'Höchste Stufe erreicht'}</span>`;}
  if(b)b.textContent=G.hints?`Hinweis ${G.hints}/3`:'Hinweis';
}
function addHint(n){const li=document.createElement('li');li.dataset.n=n;li.textContent=G.p.hints[n-1];$('#hints').appendChild(li);if(G.ui.hint)G.ui.hint(n);}
function begin(g){
  G=Object.assign({attempts:0,hints:0,ms:0,t0:performance.now(),paused:false,solved:false},g);
  if(g.mode==='daily'){const pr=S.daily.prog;if(pr&&pr.date===g.date){G.attempts=pr.a;G.hints=pr.h;G.ms=pr.ms;}}
  viewGame();
}
function endlessPuzzle(){
  const e=S.endless,first=['number','pattern','equation','geometry','spatial','logic'];let p;
  for(let k=0;k<8;k++){
    const seed=`E|${e.run}|${e.level}|${e.salt}`,R=makeRng(seed+'|meta');
    let d=tierOf(e.power);if(d>0&&R.chance(.2))d--;if(e.level<=3)d=0;
    const bag=e.level<=6?first:makeRng(`E|${e.run}|bag|${Math.floor((e.level-1)/6)}`).shuffle(TYPE_KEYS);
    p=generate(seed,bag[(e.level-1+(e.level<=6?0:e.salt))%6],d);
    if(!S.seen.includes(hashStr(p.sig)))break;
    e.salt++;
  }
  return p;
}
function startEndless(){begin({mode:'endless',p:endlessPuzzle()});}
function startDaily(){
  const date=utcDate();
  if(S.daily.done[date]){viewDailyResult(date,false);return;}
  if(S.daily.prog&&S.daily.prog.date!==date)S.daily.prog=null;
  begin({mode:'daily',p:dailyPuzzle(date),date});
}
function saveProg(){if(G&&G.mode==='daily'&&!G.solved){S.daily.prog={date:G.date,a:G.attempts,h:G.hints,ms:Math.round(elapsed())};save();}}
function leaveGame(){saveProg();G=null;}
function score(p,g){
  const base=Math.round(40+30*p.rating),mult=(g.attempts===1?1.5:Math.max(.5,1-.15*(g.attempts-1)))*(1-.2*g.hints),par=(30+14*p.rating)*1000;
  const tb=g.ms<par?Math.round(base*.2*(1-g.ms/par)):0;
  return{total:Math.max(10,Math.round(base*mult)+tb),tb};
}
function check(){
  if(!G||G.solved)return;
  const a=G.ui.get();
  if(a&&a.inc){say(a.inc);return;}
  G.attempts++;
  const r=G.p.validate(a);
  if(r===true){solved();return;}
  SND.play('bad');const st=$('#stage');st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');
  if(G.ui.wrong)G.ui.wrong(a);
  say(typeof r==='string'?r:(G.hints<3&&G.attempts>=2?'Das passt noch nicht. Ein Hinweis kann die Richtung zeigen.':'Das passt noch nicht. Prüfe deine Überlegung und versuche es erneut.'),true);
  meta();saveProg();
}
function solved(){
  const p=G.p,st=S.stats,notes=[];let party=false;
  G.ms=elapsed();G.solved=true;clearTimers();tick();
  const setRec=t=>{S.record={text:t,date:utcDate()};};
  const finishStats=()=>{
    const sc=score(p,G);st.solved++;st.points+=sc.total;st.byType[p.type]++;st.byDiff[p.diff]++;if(G.attempts===1)st.firstTry++;
    if(sc.total>st.bestPoints){if(st.bestPoints)notes.push(`Neuer Punkterekord: ${sc.total} Punkte für ein einzelnes Rätsel.`);st.bestPoints=sc.total;setRec(`${sc.total} Punkte für ein Rätsel`);}
    const bt=st.bestTime[p.diff];
    if(!bt||G.ms<bt){if(bt)notes.push(`Neue Bestzeit auf ${DIFF[p.diff]}: ${mmss(G.ms)}.`);st.bestTime[p.diff]=Math.max(1,Math.round(G.ms));setRec(`Bestzeit ${DIFF[p.diff]}: ${mmss(G.ms)}`);}
    return sc;};
  if(G.mode==='daily'){
    const D=S.daily,date=G.date;let sc={total:0,tb:0};
    if(!D.done[date]){
      sc=finishStats();
      D.done[date]={t:Math.round(G.ms),a:G.attempts,h:G.hints,d:p.diff,ty:p.type};D.count++;
      D.streak=D.last===addDays(date,-1)?D.streak+1:1;D.last=date;D.longest=Math.max(D.longest,D.streak);
      if(!D.best||G.ms<D.best){if(D.best)notes.push(`Neue Daily-Bestzeit: ${mmss(G.ms)}.`);D.best=Math.round(G.ms);}
      if(D.streak>1&&D.streak===D.longest)setRec(`Daily-Serie: ${D.streak} Tage`);
    }
    D.prog=null;checkUnlocks().forEach(n=>notes.push(`Freigeschaltet: Akzentfarbe ${n}.`));save();
    SND.play('done');burst();G=null;viewDailyResult(date,true,notes,sc.total);return;
  }
  const sc=finishStats(),e=S.endless,before=tierOf(e.power);
  e.maxLevel=Math.max(e.maxLevel,e.level);e.clean=G.attempts===1?e.clean+1:0;
  if(e.clean>e.bestClean){e.bestClean=e.clean;if(e.clean>=3)setRec(`${e.clean} Rätsel in Folge im ersten Versuch`);}
  e.power+=G.attempts===1&&!G.hints?1.4:G.attempts<=2&&G.hints<=1?1:.5;
  if(tierOf(e.power)>before){notes.push(`Neue Stufe erreicht: ${DIFF[tierOf(e.power)]}.`);party=true;}
  if(e.level%10===0){notes.push(`Level ${e.level} geschafft.`);party=true;}
  e.level++;e.salt=0;S.seen.push(hashStr(p.sig));if(S.seen.length>400)S.seen=S.seen.slice(-400);
  const un=checkUnlocks();un.forEach(n=>notes.push(`Freigeschaltet: Akzentfarbe ${n}. Du findest sie in den Einstellungen.`));if(un.length)party=true;
  save();SND.play(party?'done':'ok');if(party)burst();
  const stg=$('#stage');stg.classList.add('locked','win');$('#bar').hidden=true;say('');
  const tags=[];if(G.attempts===1)tags.push(['Im ersten Versuch',1]);else tags.push([`${G.attempts} Versuche`,0]);
  tags.push(G.hints?[`${G.hints} ${G.hints===1?'Hinweis':'Hinweise'}`,0]:['Ohne Hinweise',1]);tags.push([`Zeit ${mmss(G.ms)}`,0]);if(sc.tb)tags.push([`Tempo-Bonus +${sc.tb}`,1]);
  const res=$('#result');res.hidden=false;
  res.innerHTML=`<h3>Gelöst</h3><p class="pts">+${sc.total} Punkte</p><ul class="tags">${tags.map(t=>`<li class="${t[1]?'good':''}">${t[0]}</li>`).join('')}</ul>
    <p class="explain">${p.explain}</p>${notes.map(n=>`<p class="note">${n}</p>`).join('')}
    <button type="button" class="btn primary" data-act="next" id="bnext">Nächstes Level</button>`;
  const nb=$('#bnext');nb.focus({preventScroll:true});nb.scrollIntoView({block:'nearest',behavior:S.settings.motion?'smooth':'auto'});
}

function download(name,blob){try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;}catch(e){return false;}}
function copyText(t){
  const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-99px;top:0;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'Ergebnis kopiert':'Markiere den Text und kopiere ihn von Hand.');}catch(e){toast('Markiere den Text und kopiere ihn von Hand.');}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Ergebnis kopiert'),fallback);else fallback();
}

  let g=x.createRadialGradient(120,40,0,120,40,820);g.addColorStop(0,'rgba(61,220,255,.17)');g.addColorStop(1,'rgba(61,220,255,0)');x.fillStyle=g;x.fillRect(0,0,1080,1080);
  g=x.createRadialGradient(900,300,0,900,300,560);g.addColorStop(0,'rgba(165,147,255,.2)');g.addColorStop(1,'rgba(165,147,255,0)');x.fillStyle=g;x.fillRect(0,0,1080,1080);
  x.strokeStyle='rgba(58,74,117,.3)';x.lineWidth=1;x.beginPath();for(let i=90;i<1080;i+=90){x.moveTo(i,0);x.lineTo(i,1080);x.moveTo(0,i);x.lineTo(1080,i);}x.stroke();
  sigilCanvas(x,sigilData(date),800,360,190,acc);
  if('letterSpacing' in x)x.letterSpacing='7px';
  x.textBaseline='alphabetic';x.fillStyle='#e9eefb';x.font='600 62px '+F;x.fillText('MIND//SHAPES',84,150);
  if('letterSpacing' in x)x.letterSpacing='1px';
  x.fillStyle='#93a0bf';x.font='400 30px '+F;x.fillText('Think beyond the obvious.',86,200);
  x.fillStyle=acc;x.font='600 40px '+F;x.fillText('DAILY '+date,84,600);
  x.fillStyle='#6cf0b4';x.font='600 104px '+F;x.fillText('Solved ✓',80,715);
  [['Time',mmss(r.t)],['Attempts',String(r.a)],['Difficulty',DIFF[r.d]],['Streak',String(curStreak())]].forEach((kv,i)=>{const px=84+i*240;
    x.fillStyle='#93a0bf';x.font='400 28px '+F;x.fillText(kv[0],px,850);x.fillStyle='#e9eefb';x.font='600 52px '+F;x.fillText(kv[1],px,915);});
  x.strokeStyle='rgba(58,74,117,.9)';x.beginPath();x.moveTo(84,790);x.lineTo(996,790);x.stroke();
  c.toBlob(b=>{if(b&&download(`mindshapes-daily-${date}.png`,b))toast('Bild gespeichert');else toast('Das Bild konnte hier nicht gespeichert werden.');},'image/png');
}
function exportData(){
  const txt=JSON.stringify({app:'MIND//SHAPES',format:1,exported:new Date().toISOString(),save:S},null,2),io=$('#io');if(io)io.value=txt;
  toast(download(`mindshapes-backup-${utcDate()}.json`,new Blob([txt],{type:'application/json'}))?'Backup exportiert':'Der Export steht im Textfeld bereit.');
}
function importText(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast('Das ist kein gültiges JSON.');return;}
  const sv=o&&typeof o==='object'?(o.save&&typeof o.save==='object'?o.save:o):null;
  if(!sv||Array.isArray(sv)||typeof sv.stats!=='object'||typeof sv.endless!=='object'){toast('In dieser Datei steckt kein MIND//SHAPES-Backup.');return;}
  S=sanitize(sv);checkUnlocks();save();applySettings();viewSettings();toast('Backup importiert');
}
function burst(){
  if(!S.settings.motion||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  const c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=[THEMES[S.settings.theme].c,'#a593ff','#f26bd8','#ffc857','#6cf0b4'];
  const ps=series(44,i=>({x:W/2+(Math.random()-.5)*90,y:H*.42,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,r:5+Math.random()*7,a:Math.random()*6.3,va:(Math.random()-.5)*.3,k:i%3,c:cols[i%5]}));
  const t0=performance.now();
  (function f(t){const el=(t-t0)/1500;x.clearRect(0,0,W,H);if(el>=1)return;
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-el);x.strokeStyle=p.c;x.lineWidth=1.6;x.beginPath();
      if(p.k===0)x.arc(0,0,p.r,0,6.3);else if(p.k===1)x.rect(-p.r,-p.r,2*p.r,2*p.r);else{x.moveTo(0,-p.r);x.lineTo(p.r,p.r*.8);x.lineTo(-p.r,p.r*.8);x.closePath();}
      x.stroke();x.restore();});
    requestAnimationFrame(f);})(t0);
}

/* ---------------------------------------------------------------- Aktionen */
function armed(b){
  if(b.classList.contains('armed'))return true;
  b.classList.add('armed');b.textContent='Wirklich? Noch einmal tippen';
  setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=b.dataset.label;}},4000);return false;
}
const ACT={
  menu(){leaveGame();viewMenu();},
  endless(){leaveGame();startEndless();},
  daily(){leaveGame();startDaily();},
  stats(){leaveGame();viewStats();},
  settings(){leaveGame();viewSettings();},
  sound(b){S.settings.sound=!S.settings.sound;save();if(S.settings.sound)SND.play('select');if(b.classList.contains('sw'))viewSettings();else viewMenu();},
  motion(){S.settings.motion=!S.settings.motion;save();applySettings();viewSettings();},
  theme(b){const k=b.dataset.k;if(S.unlocked.includes(k)){S.settings.theme=k;save();applySettings();viewSettings();}},
  check(){check();},
  next(){startEndless();},
  restart(){if(G&&!G.solved){G.ui.reset();say('');SND.play('click');}},
  hint(){
    if(!G||G.solved)return;
    if(G.hints>=3){say('Alle drei Hinweise liegen bereits offen.');return;}
    G.hints++;S.stats.hints++;addHint(G.hints);meta();SND.play('select');saveProg();if(G.mode!=='daily')save();
  },
  skip(){
    if(!G||G.solved||G.mode!=='endless')return;
    const e=S.endless;e.salt++;e.power=Math.max(0,e.power-.5);e.clean=0;S.stats.skipped++;S.seen.push(hashStr(G.p.sig));save();startEndless();
  },
  copy(b){copyText(shareText(b.dataset.date));},
  png(b){sharePNG(b.dataset.date);},
  export(){exportData();},
  pickfile(){$('#impfile').click();},
  importtext(){const t=$('#io').value.trim();if(!t){toast('Füge zuerst ein Backup in das Textfeld ein.');return;}importText(t);},
  reset(b){if(!armed(b))return;const keep=S.settings,un=S.unlocked;S=defaults();S.settings=keep;S.unlocked=un;save();viewSettings();toast('Spielstand zurückgesetzt');},
  wipe(b){if(!armed(b))return;Store.del(KEY);Store.del(KEY+'.defekt');S=defaults();applySettings();viewSettings();toast('Alle lokalen Daten gelöscht');}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b,e);});
document.addEventListener('change',e=>{
  if(e.target.id!=='impfile'||!e.target.files[0])return;
  const fr=new FileReader();fr.onload=()=>importText(String(fr.result));fr.onerror=()=>toast('Die Datei ließ sich nicht lesen.');fr.readAsText(e.target.files[0]);
});
document.addEventListener('keydown',e=>{
  if(!G||e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=e.target.tagName;
  if(G.solved){return;}
  if(e.key==='Enter'){if((tag==='BUTTON'&&!e.target.classList.contains('key'))||tag==='SUMMARY')return;e.preventDefault();check();return;}
  if(G.ui.key&&G.ui.key(e))e.preventDefault();
});
document.addEventListener('visibilitychange',()=>{
  if(!G||G.solved)return;
  if(document.hidden){G.ms=elapsed();G.paused=true;saveProg();}else{G.t0=performance.now();G.paused=false;}
});
window.addEventListener('pagehide',saveProg);

/* ---------------------------------------------------------------- Start */
S=load();checkUnlocks();applySettings();viewMenu();
})();
</script>
